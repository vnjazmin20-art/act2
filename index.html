<!DOCTYPE html>
<html>
<head>
    <title>Search for a Value</title>
</head>
<body>

    <h1>Search for a Value</h1>

    <label>Enter array values (separated by commas):</label>
    <br>
    <input type="text" id="arrayInput">

    <br><br>

    <label>Enter value to search:</label>
    <br>
    <input type="text" id="searchValue">

    <br><br>

    <button onclick="searchArray()">Search</button>

    <h2>Result:</h2>

    <p id="result"></p>

    <script>
        function searchArray() {

            let input = document.getElementById("arrayInput").value;
            let searchValue = document.getElementById("searchValue").value;

            let currentItem = "";
            let index = 0;
            let found = false;

            // Adding a trailing comma ensures the last value in the string is evaluated
            let fullString = input + ",";

            for (let i = 0; i < fullString.length; i++) {

                if (fullString[i] === ",") {

                    if (currentItem.trim() === searchValue.trim()) {
                        document.getElementById("result").innerHTML =
                            'Value "' + searchValue + '" found at index ' + index + '.';

                        found = true;
                        break;
                    }

                    currentItem = "";
                    index++;

                } else {
                    currentItem += fullString[i];
                }
            }

            if (found === false) {
                document.getElementById("result").innerHTML =
                    'Value "' + searchValue + '" does not exist in the array.';
            }
        }
    </script>

</body>
</html>
