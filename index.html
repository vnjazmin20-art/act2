<!DOCTYPE html>
<html>
<head>
    <title>Activity 2 - Search for a Value</title>
</head>
<body>

<h2> Search for a Value</h2>

<script>

let numbers = [];
let size = parseInt(prompt("Enter the number of elements:"));

for (let i = 0; i < size; i++) {
    numbers[i] = parseInt(prompt("Enter value " + (i + 1) + ":"));
}

let searchValue = parseInt(prompt("Enter the value to search:"));

let found = false;

document.write("<h3>Entered Array</h3>");

for (let i = 0; i < numbers.length; i++) {
    document.write("Index " + i + ": " + numbers[i] + "<br>");
}

for (let i = 0; i < numbers.length; i++) {
    if (numbers[i] === searchValue) {
        document.write("<br>Value " + searchValue + " found at index " + i + ".");
        found = true;
    }
}

if (found === false) {
    document.write("<br>Value " + searchValue + " does not exist in the array.");
}

</script>

</body>
</html>
